# Autogram profile for the generated GTIB byte-completeness dataset.
dataset: gtib
data_path: data/gtib-emulation/timeseries_derived.csv
raw_path: data/gtib-emulation/timeseries_raw.csv
known_path: configs/gtib_known.yaml
seed: 0

schema:
  backend: subagent
  harness: copilot

profile:
  time_index: timestamp
  group_keys: [consumer_id]
  condition_columns:
    - archetype
    - label
  windows: [10, 45, 60]
  cadence_seconds: 60
  max_lag: 45
  run_lengths: [10]
  max_conjunction_terms: 3
  advanced: true
  max_degree: 2
  proportional: true
  agg_kinds: [SUM]

eval:
  band_mode: adaptive
  tolerance: 0.05
  hold_rate_threshold: 0.62
  ci_alpha: 0.05

search:
  proposer: enumeration
  max_complexity: 16
  max_add_arity: 3
  max_capability_tiers: 5
  max_rules: 400000
  max_nonlinear_leaves: 64
  max_linear_leaves: 32
  max_conditioned_rules: 0
